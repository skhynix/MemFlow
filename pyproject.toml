[project]
name = "memflow"
version = "0.1.0"
description = "Skill retrieval and injection layer for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.29,<2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "qdrant-client==1.18.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.15.12",
]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.8"]
# Optional LLM reranker providers, imported only when the stage is enabled.
ollama = ["ollama>=0.6.1"]
openai = ["openai>=2.30.0"]
memmachine = ["memmachine-client>=0.3.3"]
# Client-side BM25 sparse vectors for Qdrant hybrid search (MEMFLOW_HYBRID_SEARCH_ENABLED=on).
# Imported lazily by QdrantStore, so dense-only deployments don't need it.
hybrid = ["fastembed>=0.3.0"]

[project.scripts]
memflow = "memflow.cli:main"
memflow-mcp = "memflow.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.12.24"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
